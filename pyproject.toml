[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitora"
version = "0.1.0"
description = "SITORA — Strategic Intent to Operational Reality Alignment (reference evaluator)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "OrcaEIS" }]
keywords = ["alignment", "governance", "compliance", "enterprise", "audit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
schema = ["jsonschema>=4"]
dev = ["pytest>=7", "jsonschema>=4"]

[project.scripts]
sitora-eval = "evaluator.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
